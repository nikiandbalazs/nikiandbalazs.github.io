<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Niki & Balázs</title>
  <meta name="description" content="Photos from our wedding · Zdjęcia z naszego ślubu · Esküvői képeink">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fafaf8">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Niki & Balázs · 28.08.2026">
  <meta property="og:description" content="Photos from our wedding · Zdjęcia z naszego ślubu · Esküvői képeink">
  <meta property="og:image" content="https://nikiandbalazs.github.io/assets/share.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- The first photo starts loading straight away instead of waiting for photos.json. -->
  <link rel="preload" as="image" href="photos/colour/large/20.jpg" fetchpriority="high">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <!-- Fonts load without holding up the page; until then the Didot/Helvetica fallbacks show. -->
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=boska@300,301,400,401&f[]=switzer@300,400,500&display=swap" media="print" onload="this.media='all'">
  <!-- Bump ?v= on these three files after changing them, so browsers fetch the new copies. -->
  <link rel="stylesheet" href="assets/style.css?v=12">
  <script src="assets/i18n.js?v=12" defer></script>
  <script src="assets/app.js?v=12" defer></script>
</head>
<body>
  <header class="intro" id="top">
    <div class="meta">
      <span class="meta-date" data-i18n="date">28 August 2026</span>
      <div class="langs" id="langs" role="group" data-i18n-aria="language" aria-label="Language"></div>
      <a href="#download-all" class="meta-link" data-i18n="downloadAllLink">Download all</a>
    </div>
    <h1>Niki <em>&amp;</em> Balázs</h1>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5z"/></svg>
    <p class="lede" data-i18n="lede">Our wedding photos. We’d love to share the day with you.</p>
    <div class="intro-actions">
      <button class="play-btn" type="button" data-play="current">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5z"/></svg>
        <span data-i18n="playSlideshow">Play slideshow</span>
      </button>
    </div>
    <p class="hint" id="hint"></p>
  </header>

  <section class="highlights" data-i18n-aria="carousel" aria-label="All photos, one at a time">
    <div class="carousel" id="carousel" tabindex="0"></div>
    <div class="carousel-nav">
      <button class="round" id="prev" data-i18n-aria="prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="progress"><span id="progress"></span></div>
      <span class="count" id="carousel-count"></span>
      <button class="round" id="next" data-i18n-aria="next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <nav class="chapter-links" data-i18n-aria="chapters" aria-label="Chapters">
      <a href="#ceremony"><span class="num">i.</span><span data-i18n="ceremony">The ceremony</span></a>
      <a href="#garden"><span class="num">ii.</span><span data-i18n="garden">In the garden</span></a>
    </nav>
  </section>

  <div class="bar">
    <div class="bar-inner">
      <span class="bar-label" data-i18n="viewQuestion">How would you like to see them?</span>
      <div class="controls" data-controls></div>
    </div>
  </div>

  <main id="gallery"></main>

  <section class="take-home" id="download-all" hidden>
    <div class="chapter-head">
      <h2 data-i18n="downloadHeading">Download all</h2>
    </div>
    <p class="note" data-i18n="downloadNote"></p>
    <div class="take-home-body">
      <a class="zip-main" id="zip-main">
        <img id="zip-main-img" alt="" loading="lazy">
        <span class="zip-main-text">
          <span class="take-home-lede" id="download-lede"></span>
          <span class="zip-go">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>
            <span data-i18n="downloadAllPhotos">Download all photos</span>
          </span>
          <span class="zip-meta" id="zip-main-meta"></span>
        </span>
      </a>
      <div class="zip-others">
        <p class="other-label" data-i18n="otherVersions">Other versions</p>
        <div class="zip-list" id="zip-list"></div>
      </div>
    </div>
  </section>

  <footer class="outro">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5z"/></svg>
    <p class="sign"><span data-i18n="signOff">With love,</span><br>Niki <em>&amp;</em> Balázs</p>
    <div class="outro-actions">
      <button class="play-btn" type="button" data-play="start">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5z"/></svg>
        <span data-i18n="playSlideshow">Play slideshow</span>
      </button>
      <a class="play-btn" href="#top">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6m-6 6 6-6 6 6"/></svg>
        <span data-i18n="toTop">Back to the top</span>
      </a>
    </div>
  </footer>

  <dialog class="viewer" id="viewer" data-i18n-aria="viewer" aria-label="Photo viewer">
    <div class="viewer-top">
      <span class="count" id="viewer-count"></span>
      <button class="text-btn play" id="play" type="button" aria-pressed="false">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        <span id="play-label"></span>
      </button>
      <button class="text-btn" id="close" type="button"><span data-i18n="close">Close</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="viewer-controls controls" data-controls></div>
    <div class="viewer-stage" id="stage"></div>
    <div class="viewer-bottom">
      <button class="round big" id="viewer-prev" data-i18n-aria="prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="download" id="download" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>
        <span data-i18n="downloadPhoto">Save photo</span>
      </button>
      <button class="round big" id="viewer-next" data-i18n-aria="next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
